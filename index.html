<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Multiverso da Tecnologia: jogo do estande de IA da Unimar Aberta.">
<title>Multiverso da Tecnologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Sora:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #060918;
    --ink-2: #0d1330;
    --text: #e9edff;
    --muted: #97a0c6;
    --rune: #f3c35a;
    --accent: #3ef2e0;
    --line: rgba(233, 237, 255, .14);
    --pc: #3ef2e0;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .stage { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 64px 72px; box-sizing: border-box; }
  .screen { width: min(1040px, 100%); display: grid; justify-items: center; gap: clamp(14px, 2.4vh, 26px); text-align: center; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }

  .eyebrow { font-family: var(--mono); font-size: clamp(11px, 1.3vw, 14px); letter-spacing: .32em; text-transform: uppercase; color: var(--pc); }
  h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .02em; }
  h1 { font-size: clamp(32px, 6vw, 80px); line-height: 1.04; }
  h2 { font-size: clamp(24px, 3.9vw, 50px); line-height: 1.1; }
  h1 em, h2 em { font-style: normal; color: var(--rune); text-shadow: 0 0 28px rgba(243,195,90,.45); }
  .pcol { color: var(--pc); text-shadow: 0 0 24px color-mix(in srgb, var(--pc) 50%, transparent); }
  .lead { font-size: clamp(16px, 2vw, 22px); color: var(--muted); max-width: 48ch; line-height: 1.55; margin: 0; font-weight: 300; text-wrap: balance; }
  .lead strong { color: var(--text); font-weight: 600; }
  .story { text-shadow: 0 0 12px var(--ink), 0 0 24px var(--ink); font-size: clamp(17px, 2.1vw, 24px); line-height: 1.6; max-width: 52ch; margin: 0; font-weight: 300; text-wrap: pretty; }
  .story strong { font-weight: 600; color: var(--pc); }

  .btn {
    font: 600 clamp(15px, 1.7vw, 19px)/1 var(--body); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); background: var(--pc); border: 0; border-radius: 999px; padding: 18px 34px; cursor: pointer;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--pc) 60%, transparent), 0 0 36px color-mix(in srgb, var(--pc) 45%, transparent);
    transition: transform .15s ease, box-shadow .2s ease; display: inline-flex; align-items: center; gap: 12px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--pc), 0 0 54px color-mix(in srgb, var(--pc) 70%, transparent); }
  .btn kbd { font: 600 12px var(--mono); background: rgba(6,9,24,.18); padding: 4px 7px; border-radius: 6px; letter-spacing: 0; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--pc); }
  :focus-visible { outline: 2px solid var(--rune); outline-offset: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

  .hud { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; font: 400 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .energy { color: var(--rune); }
  .energy b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Hub de portais */
  .portals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 2vw, 24px); width: 100%; }
  .portal { --c: var(--accent); position: relative; cursor: pointer; border: 0; background: none; color: var(--text); display: grid; justify-items: center; gap: 10px; padding: 8px 4px 12px; border-radius: 20px; font-family: var(--body); }
  .ring {
    width: min(100%, 180px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; display: grid; place-items: center;
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent) 0 38%, transparent 62%);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 70%, transparent), 0 0 38px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 40px color-mix(in srgb, var(--c) 35%, transparent);
    transition: transform .25s ease, box-shadow .25s ease, filter .3s ease;
  }
  .ring::before, .ring::after { content: ""; position: absolute; inset: 7%; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--c) 75%, transparent); animation: spin 14s linear infinite; }
  .ring::after { inset: 17%; border-style: dotted; border-width: 3px; animation-duration: 9s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glyph { width: 42%; height: 42%; color: var(--c); filter: drop-shadow(0 0 10px var(--c)); }
  .portal .name { font-family: var(--display); font-weight: 700; font-size: clamp(15px, 2vw, 23px); letter-spacing: .05em; }
  .portal .key { font: 600 11px var(--mono); color: var(--muted); letter-spacing: .15em; text-transform: uppercase; }
  .portal:hover .ring, .portal.sel .ring { transform: scale(1.06); box-shadow: 0 0 0 3px var(--c), 0 0 70px color-mix(in srgb, var(--c) 70%, transparent), inset 0 0 60px color-mix(in srgb, var(--c) 55%, transparent); }
  .portal.sel .name { color: var(--c); }
  .portal.done .ring { filter: saturate(.35) brightness(.7); }
  .portal.done .key { color: var(--c); }
  .portal.done .ring::before, .portal.done .ring::after { animation-play-state: paused; }

  /* Selo do portal ativo */
  .seal { width: clamp(84px, 11vw, 120px); aspect-ratio: 1; border-radius: 50%; position: relative; display: grid; place-items: center; max-width: 100%;
    background: radial-gradient(circle, color-mix(in srgb, var(--pc) 28%, transparent) 0 40%, transparent 66%);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--pc) 70%, transparent), 0 0 40px color-mix(in srgb, var(--pc) 45%, transparent), inset 0 0 40px color-mix(in srgb, var(--pc) 35%, transparent); }
  .seal::before, .seal::after { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--pc) 75%, transparent); animation: spin 14s linear infinite; }
  .seal::after { inset: 19%; border-style: dotted; border-width: 3px; animation-duration: 9s; animation-direction: reverse; }
  .seal svg { width: 44%; height: 44%; color: var(--pc); filter: drop-shadow(0 0 10px var(--pc)); }

  /* Escolhas */
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 18px); width: 100%; }
  .choice { text-align: left; cursor: pointer; color: var(--text);
    background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 14%, var(--ink-2)), var(--ink-2) 70%);
    border: 1px solid color-mix(in srgb, var(--pc) 35%, transparent); border-radius: 16px; padding: 18px 18px 20px;
    display: grid; gap: 10px; align-content: start; font-family: var(--body);
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease, opacity .3s ease; }
  .choice:hover, .choice.sel { transform: translateY(-3px); border-color: var(--pc); box-shadow: 0 0 34px color-mix(in srgb, var(--pc) 35%, transparent); }
  .choice .k { font: 700 17px var(--display); color: var(--ink); background: var(--pc); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .choice .t { font-weight: 600; font-size: clamp(16px, 1.7vw, 20px); line-height: 1.3; }
  .choice .d { color: var(--muted); font-size: clamp(13px, 1.3vw, 15px); line-height: 1.5; }

  /* Tecnologia revelada */
  .reveal { width: min(780px, 100%); display: grid; gap: 16px; text-align: left; border-left: 2px solid var(--pc); padding: 4px 0 4px 22px; }
  .reveal p { margin: 0; font-size: clamp(16px, 1.8vw, 21px); line-height: 1.55; }
  .reveal .tag { display: block; font: 600 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--pc); margin-bottom: 4px; }
  .reveal .ia { color: var(--rune); font-weight: 600; }
  .gain { font: 600 clamp(14px, 1.6vw, 18px) var(--mono); color: var(--rune); letter-spacing: .1em; text-shadow: 0 0 16px rgba(243,195,90,.6); animation: pop .6s .2s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }

  /* Análise */
  .scan { font: 400 clamp(13px, 1.4vw, 16px) var(--mono); color: var(--muted); letter-spacing: .12em; min-height: 1.5em; }
  .meter { width: min(520px, 100%); height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7be07a, #ff7a9c, #f3c35a, #8b6cff); box-shadow: 0 0 14px var(--rune); }
  .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .links span { font: 600 12px var(--mono); letter-spacing: .16em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; border: 1px solid currentColor; }

  /* Cartão do perfil */
  .card { width: min(820px, 100%); box-sizing: border-box; position: relative; overflow: hidden; border-radius: 24px; padding: clamp(22px, 3.4vw, 40px);
    background: radial-gradient(circle at 88% 12%, color-mix(in srgb, var(--pc) 28%, transparent), transparent 46%), linear-gradient(160deg, #111a44, #070b1f 70%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 45%, transparent), 0 0 70px color-mix(in srgb, var(--pc) 22%, transparent);
    display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 3vw, 34px); align-items: center; text-align: left; }
  .card .kicker { font: 600 12px var(--mono); letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
  .card .pname { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 4.6vw, 58px); line-height: 1.02; color: var(--pc); text-shadow: 0 0 30px color-mix(in srgb, var(--pc) 50%, transparent); margin: 6px 0 12px; text-wrap: balance; }
  .card .lema { font-size: clamp(16px, 1.9vw, 22px); font-weight: 600; margin: 0 0 8px; line-height: 1.4; }
  .card .desc { color: var(--muted); font-size: clamp(14px, 1.5vw, 17px); line-height: 1.55; margin: 0 0 16px; }
  .card .poder { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: clamp(15px, 1.7vw, 19px); }
  .card .poder span { font: 600 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--rune); }
  .card .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-top: 14px; border-top: 1px solid var(--line); font: 400 12px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .card .foot b { color: var(--rune); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .seal { width: clamp(96px, 14vw, 160px); }

  /* Fechamento: curso de IA */
  .ia-word { font-family: var(--display); font-weight: 900; font-size: clamp(38px, 7.4vw, 96px); line-height: 1; letter-spacing: .02em;
    background: linear-gradient(90deg, #7be07a, #3ef2e0 30%, #8b6cff 60%, #ff7a9c 80%, #f3c35a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(62,242,224,.35)); animation: rise 1s .3s cubic-bezier(.2,.8,.2,1) both; text-wrap: balance; }
  .course-main { width: min(820px, 100%); box-sizing: border-box; border-radius: 20px; padding: clamp(18px, 3vw, 28px); text-align: left; display: grid; gap: 8px;
    background: linear-gradient(135deg, rgba(62,242,224,.12), rgba(139,108,255,.16)); box-shadow: inset 0 0 0 1px rgba(62,242,224,.4), 0 0 60px rgba(62,242,224,.15); }
  .course-main small { font: 600 12px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .course-main b { font-family: var(--display); font-size: clamp(22px, 3vw, 34px); line-height: 1.15; }
  .course-main p { margin: 0; color: var(--text); font-size: clamp(15px, 1.6vw, 18px); line-height: 1.55; font-weight: 300; }
  .course-main p strong { font-weight: 600; color: var(--pc); }
  .others { font: 400 clamp(12px, 1.3vw, 14px) var(--mono); color: var(--muted); letter-spacing: .08em; }
  .others b { color: var(--text); font-weight: 400; }

  /* Descobrir mais */
  .more { display: grid; grid-template-columns: auto 1fr; gap: clamp(18px, 3vw, 36px); align-items: center; width: min(760px, 100%); text-align: left; }
  .qr { background: #fff; padding: 14px; border-radius: 16px; width: clamp(150px, 20vw, 230px); max-width: 100%; box-sizing: border-box; box-shadow: 0 0 50px rgba(62,242,224,.35); }
  .qr svg { display: block; width: 100%; height: auto; }
  .more p { margin: 0 0 10px; font-size: clamp(15px, 1.7vw, 19px); line-height: 1.55; }
  .more .url { font: 400 13px var(--mono); color: var(--accent); word-break: break-all; }

  /* Mentor: o Mestre dos Portais (personagem original) */
  .mentor { display: flex; gap: clamp(12px, 2vw, 20px); align-items: center; width: min(780px, 100%); text-align: left; }
  .mentor .m { width: clamp(64px, 8vw, 104px); flex: none; color: var(--pc); animation: float 4s ease-in-out infinite; overflow: visible; }
  .mentor.big .m { width: clamp(90px, 12vw, 150px); }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .bubble { position: relative; flex: 1; background: rgba(10,14,38,.88); border: 1px solid color-mix(in srgb, var(--pc) 45%, transparent);
    border-radius: 16px; padding: 12px 18px 14px; font-size: clamp(15px, 1.75vw, 20px); line-height: 1.5; font-weight: 300;
    box-shadow: 0 0 30px color-mix(in srgb, var(--pc) 18%, transparent); }
  .bubble::before { content: ""; position: absolute; left: -8px; top: 50%; width: 14px; height: 14px; background: inherit;
    border-left: 1px solid color-mix(in srgb, var(--pc) 45%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--pc) 45%, transparent);
    transform: translateY(-50%) rotate(45deg); }
  .bubble .who { display: block; font: 600 11px var(--mono); letter-spacing: .26em; text-transform: uppercase; color: var(--rune); margin-bottom: 4px; }
  .bubble strong { font-weight: 600; color: var(--pc); }

  /* Conjuração: desenhar o círculo */
  .spell { width: min(360px, 64vw, 44vh); aspect-ratio: 1; max-width: 100%; position: relative; border-radius: 50%; touch-action: none; cursor: crosshair;
    background: radial-gradient(circle, color-mix(in srgb, var(--pc) 12%, transparent), transparent 70%); }
  .spell canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spell-hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 600 12px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 30%; }
  .spell-msg { font: 600 13px var(--mono); letter-spacing: .14em; color: var(--rune); min-height: 1.4em; }

  /* Grimório de artefatos */
  .grimorio { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .grimorio .glabel { font: 600 12px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--rune); margin-right: 4px; }
  .slot { --c: var(--muted); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; border: 1px dashed var(--line); font: 400 12px var(--mono); color: var(--muted); letter-spacing: .06em; }
  .slot svg { width: 18px; height: 18px; color: var(--c); flex: none; }
  .slot.got { border-style: solid; border-color: color-mix(in srgb, var(--c) 60%, transparent); color: var(--text); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 25%, transparent); }
  .relic { display: flex; gap: clamp(14px, 2.4vw, 24px); align-items: center; text-align: left; }
  .relic .rname { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 4.2vw, 52px); line-height: 1.05; color: var(--pc); text-shadow: 0 0 26px color-mix(in srgb, var(--pc) 50%, transparent); }
  .relic .rtech { font: 600 13px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .h2s { font-size: clamp(20px, 3vw, 36px); }
  .screen.tight { gap: clamp(8px, 1.6vh, 16px); }
  .screen.tight .ia-word { font-size: clamp(34px, 6vw, 76px); }
  .screen.tight .mentor .m { width: clamp(48px, 6vw, 72px); }
  .screen.tight .bubble { padding: 8px 16px 10px; font-size: clamp(14px, 1.6vw, 18px); }
  .screen.tight .course-main { padding: clamp(14px, 2.4vw, 22px); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); font: 400 12px var(--mono); color: var(--muted); letter-spacing: .08em; }
  .bar .brand { letter-spacing: .28em; text-transform: uppercase; }
  .bar .ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: 400 12px var(--mono); color: var(--muted); background: rgba(13,19,48,.7); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--accent); border-color: rgba(62,242,224,.5); }
  .chip:hover { color: var(--text); }

  .flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, #fff 0, var(--pc) 18%, transparent 60%); }
  .flash.go { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: .95; } 100% { opacity: 0; } }

  @media (max-width: 760px) {
    .portals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choices { grid-template-columns: 1fr; }
    .card, .more { grid-template-columns: 1fr; }
    .stage { align-items: start; overflow-y: auto; }
    body { overflow: auto; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="stage" id="stage" aria-live="polite"></main>
<div class="flash" id="flash"></div>
<footer class="bar">
  <span class="brand">Unimar Aberta · Estande de IA</span>
  <span class="ctrls">
    <button class="chip" id="bt-som" aria-pressed="true" type="button">Som ligado</button>
    <button class="chip" id="bt-voz" aria-pressed="true" type="button">Narração ligada</button>
    <button class="chip" id="bt-tela" type="button">Tela cheia</button>
    <button class="chip" id="bt-reset" type="button">Recomeçar (Esc)</button>
  </span>
</footer>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];

    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }

const stage = document.getElementById("stage");

const LETRAS = ["A", "B", "C"];
let st = {};
let somOn = true, vozOn = true, idleTimer = null, timers = [];
const IDLE_MS = 60000; // volta ao início sozinho após 60 s sem interação

function novoEstado() { return { tela: "intro", portal: null, feitos: [], escolhas: [], artefatos: [], energia: 0, sel: 0, perfil: null }; }
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }

/* ---------- Áudio gerado no navegador (use fone) ---------- */
let ac = null, drone = null;
const HUB_ACORDE = [55, 82.4, 110.2, 164.8];
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function startDrone() {
  const a = audio(); if (!a || drone) return;
  const g = a.createGain(); g.gain.value = 0; g.connect(a.destination);
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 520; f.connect(g);
  const oscs = HUB_ACORDE.map((hz, i) => {
    const o = a.createOscillator(); o.type = i % 2 ? "sawtooth" : "sine"; o.frequency.value = hz;
    o.detune.value = (i - 1.5) * 6; o.connect(f); o.start(); return o;
  });
  const lfo = a.createOscillator(); lfo.frequency.value = .07;
  const lg = a.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  g.gain.linearRampToValueAtTime(somOn ? .08 : 0, a.currentTime + 3);
  drone = { g, oscs, f };
}
function acorde(freqs) {
  if (!drone || !ac) return;
  drone.oscs.forEach((o, i) => o.frequency.linearRampToValueAtTime(freqs[i], ac.currentTime + 1.5));
}
function setDrone(on) { if (drone && ac) drone.g.gain.linearRampToValueAtTime(on ? .08 : 0, ac.currentTime + .6); }
function whoosh() {
  const a = audio(); if (!a || !somOn) return;
  const len = a.sampleRate * 1.4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
  f.frequency.setValueAtTime(180, a.currentTime); f.frequency.exponentialRampToValueAtTime(3200, a.currentTime + 1.1);
  const g = a.createGain(); g.gain.setValueAtTime(.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.35, a.currentTime + .25); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 1.4);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function chime(notes = [659.3, 987.8, 1318.5], vol = .12) {
  const a = audio(); if (!a || !somOn) return;
  notes.forEach((hz, i) => {
    const o = a.createOscillator(), g = a.createGain(); o.type = "triangle"; o.frequency.value = hz;
    const t = a.currentTime + i * .09;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .75);
  });
}
function tick() { chime([880], .05); }
function fanfare() { chime([523.3, 659.3, 784, 1046.5, 1318.5], .13); }
// sons ambientes de cada mundo
let ambT = 0;
function ambiente(cena, t) {
  const a = ac; if (!a || !somOn || a.state !== "running") return;
  if (cena === "saude" && t - ambT > 1000) { ambT = t; // bipe do monitor cardíaco
    const o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = 988;
    g.gain.setValueAtTime(.04, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .12);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .15);
  }
  if (cena === "tech" && t - ambT > 260) { ambT = t; if (Math.random() < .5) return; // dados processando
    const o = a.createOscillator(), g = a.createGain(); o.type = "square"; o.frequency.value = 1200 + Math.random() * 1800;
    g.gain.setValueAtTime(.008, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .05);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .06);
  }
  if (cena === "agro" && t - ambT > 2600) { ambT = t; // pássaros no campo
    const o = a.createOscillator(), g = a.createGain(); o.type = "sine";
    const b = 2400 + Math.random() * 900;
    o.frequency.setValueAtTime(b, a.currentTime); o.frequency.exponentialRampToValueAtTime(b * 1.4, a.currentTime + .08);
    o.frequency.exponentialRampToValueAtTime(b * .9, a.currentTime + .16);
    g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.025, a.currentTime + .03); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .2);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .22);
  }
  if (cena === "empreender" && t - ambT > 1800) { ambT = t; // notificação de venda
    chime([1318.5, 1760], .025);
  }
}

/* ---------- Narração em português ---------- */
let vozPt = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); vozPt = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null; } catch (e) {} }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function semTags(s) { return s.replace(/<[^>]+>/g, ""); }
function fala(txt) {
  if (!vozOn || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(semTags(txt)); u.lang = "pt-BR"; if (vozPt) u.voice = vozPt; u.rate = .97; u.pitch = .6; speechSynthesis.speak(u); } catch (e) {}
}
function calar() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- Céu, portal e cenas imersivas em canvas ---------- */
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let W, H, DPR, stars = [], warp = 0, tint = "#3ef2e0", spinBoost = 0, cena = null, cenaFade = 0, rot = 0;
let rain = [], nodes = [];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  stars = Array.from({ length: 240 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random(), z: Math.random() * .8 + .2 }));
  const colW = 22 * DPR; rain = Array.from({ length: Math.ceil(W / colW) }, (_, i) => ({ x: i * colW, y: Math.random() * H, v: (2 + Math.random() * 5) * DPR }));
  nodes = Array.from({ length: 34 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4 * DPR, vy: (Math.random() - .5) * .4 * DPR }));
}
addEventListener("resize", resize); resize();
const RUNAS = ["∑", "01", "∇", "λ", "◇", "σ", "10", "∫", "θ", "◇", "π", "11", "∞", "Δ", "◇", "ƒ", "00", "μ", "Ω", "◇", "β", "01", "φ", "◇"];
const FORMULAS = ["y = σ(Wx + b)", "while (vivo) { aprender(); }", "∇L(θ) → 0", "P(A|B) = P(B|A)·P(A) / P(B)", "if (dados) criarFuturo()", "∑ wᵢ·xᵢ", "f(x) = max(0, x)", "ia.treinar(mundo)"];
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function drawCena(t, alpha) {
  if (!cena || alpha <= 0) return;
  const c = tint, m = reduce ? 0 : 1;
  cx.save(); cx.globalAlpha = alpha;
  if (cena === "agro") {
    // horizonte e fileiras de plantação em perspectiva
    const hy = H * .58;
    const sky = cx.createLinearGradient(0, 0, 0, hy); sky.addColorStop(0, "rgba(6,9,24,0)"); sky.addColorStop(1, hexA(c, .14));
    cx.fillStyle = sky; cx.fillRect(0, 0, W, hy);
    cx.strokeStyle = hexA(c, .35); cx.lineWidth = 1.2 * DPR;
    for (let i = -18; i <= 18; i++) { cx.beginPath(); cx.moveTo(W / 2 + i * 6 * DPR, hy); cx.lineTo(W / 2 + i * W * .09, H); cx.stroke(); }
    const off = (t * .00025 * m) % 1;
    for (let k = 0; k < 12; k++) { const f = Math.pow((k + off) / 12, 2); const y = hy + (H - hy) * f;
      cx.strokeStyle = hexA(c, .08 + .25 * f); cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    // drone varrendo o campo
    const dx = W / 2 + Math.sin(t * .0006 * m) * W * .32, dy = H * .3 + Math.sin(t * .0013 * m) * H * .03;
    const sy = hy + (H - hy) * .45;
    const cone = cx.createLinearGradient(0, dy, 0, sy); cone.addColorStop(0, hexA(c, .35)); cone.addColorStop(1, hexA(c, 0));
    cx.fillStyle = cone; cx.beginPath(); cx.moveTo(dx, dy); cx.lineTo(dx - 120 * DPR, sy); cx.lineTo(dx + 120 * DPR, sy); cx.closePath(); cx.fill();
    cx.fillStyle = "#e9edff"; cx.fillRect(dx - 14 * DPR, dy - 2 * DPR, 28 * DPR, 4 * DPR);
    cx.fillStyle = c; cx.beginPath(); cx.arc(dx, dy + 4 * DPR, 3 * DPR, 0, 7); cx.fill();
  }
  if (cena === "saude") {
    // traçado de eletrocardiograma
    const y0 = H * .8, amp = H * .09, sp = t * .25 * m * DPR;
    cx.strokeStyle = hexA(c, .55); cx.lineWidth = 2.2 * DPR; cx.shadowColor = c; cx.shadowBlur = 12 * DPR;
    cx.beginPath();
    for (let x = 0; x <= W; x += 3 * DPR) {
      const ph = ((x + sp) % (320 * DPR)) / (320 * DPR); let y = y0;
      if (ph > .40 && ph < .44) y -= amp * .15; else if (ph > .48 && ph < .50) y += amp * .25;
      else if (ph >= .50 && ph < .53) y -= amp; else if (ph >= .53 && ph < .56) y += amp * .45;
      else if (ph > .66 && ph < .74) y -= amp * .2 * Math.sin((ph - .66) / .08 * Math.PI);
      x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
    }
    cx.stroke(); cx.shadowBlur = 0;
    // grade de monitor
    cx.strokeStyle = hexA(c, .06); cx.lineWidth = 1;
    for (let x = 0; x < W; x += 40 * DPR) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
    for (let y = 0; y < H; y += 40 * DPR) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  }
  if (cena === "empreender") {
    // rede de negócios conectados + gráfico subindo
    for (const n of nodes) { n.x += n.vx * m; n.y += n.vy * m; if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1; }
    const lim = 190 * DPR;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < lim) { cx.strokeStyle = hexA(c, .3 * (1 - d / lim)); cx.lineWidth = DPR; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    }
    for (const n of nodes) { cx.fillStyle = hexA(c, .7); cx.beginPath(); cx.arc(n.x, n.y, 2.5 * DPR, 0, 7); cx.fill(); }
    const bars = 14, bw = W / bars;
    for (let i = 0; i < bars; i++) {
      const h = H * (.05 + .22 * (i / bars)) * (1 + .08 * Math.sin(t * .002 * m + i));
      cx.fillStyle = hexA(c, .07 + .05 * (i / bars)); cx.fillRect(i * bw + bw * .2, H - h, bw * .6, h);
    }
  }
  if (cena === "tech") {
    // chuva de código
    cx.font = `${15 * DPR}px "JetBrains Mono", monospace`;
    for (const r of rain) {
      r.y += r.v * m; if (r.y > H + 200 * DPR) r.y = -Math.random() * H * .5;
      for (let k = 0; k < 10; k++) {
        cx.fillStyle = hexA(k === 0 ? "#e9edff" : c, k === 0 ? .45 : .22 * (1 - k / 10));
        cx.fillText(Math.random() < .5 ? "1" : "0", r.x, r.y - k * 18 * DPR);
      }
    }
  }
  cx.restore();
}

function draw(t) {
  cx.fillStyle = "rgba(6,9,24," + (warp > .05 ? .25 : 1) + ")";
  cx.fillRect(0, 0, W, H);
  const cxm = W / 2, cym = H / 2, R = Math.hypot(W, H) / 2, m = reduce ? 0 : 1;
  const g = cx.createRadialGradient(cxm, cym, 0, cxm, cym, R);
  g.addColorStop(0, hexA(tint, .16)); g.addColorStop(.45, "rgba(139,108,255,.06)"); g.addColorStop(1, "rgba(6,9,24,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  cenaFade += ((cena ? 1 : 0) - cenaFade) * .04;
  const starA = 1 - cenaFade * .7;
  for (const s of stars) {
    s.r -= (0.0009 + warp * 0.03) * s.z * m;
    if (s.r <= 0.02) { s.r = 1; s.a = Math.random() * Math.PI * 2; }
    s.a += (0.0008 + spinBoost * .01) * m;
    const x = cxm + Math.cos(s.a) * s.r * R, y = cym + Math.sin(s.a) * s.r * R;
    const size = (1.4 * s.z) * DPR * (0.4 + s.r);
    if (warp > .05) { cx.strokeStyle = hexA(tint, .5 * s.z); cx.lineWidth = size; cx.beginPath(); cx.moveTo(x, y);
      cx.lineTo(cxm + Math.cos(s.a) * (s.r + warp * .08) * R, cym + Math.sin(s.a) * (s.r + warp * .08) * R); cx.stroke(); }
    else { cx.fillStyle = `rgba(233,237,255,${(0.25 + 0.6 * s.z * s.r) * starA})`; cx.fillRect(x, y, size, size); }
  }
  drawCena(t, cenaFade * .9);

  rot += (0.004 + spinBoost * .05) * m;
  const strong = st.tela === "intro" || st.tela === "analise";
  const base = Math.min(W, H) * (strong ? .38 : .47);
  const ringA = (strong ? .38 : .12) * (1 - cenaFade * .6);
  cx.save(); cx.translate(cxm, cym);
  for (let k = 0; k < 3; k++) {
    const rr = base * (1 - k * .14) * (1 + warp * .6);
    cx.save(); cx.rotate((k % 2 ? -1 : 1) * rot * (k + 1));
    cx.strokeStyle = hexA(k === 1 ? "#f3c35a" : tint, ringA); cx.lineWidth = DPR * (k === 1 ? 1 : 1.5);
    cx.setLineDash(k === 0 ? [2 * DPR, 10 * DPR] : k === 1 ? [18 * DPR, 6 * DPR, 2 * DPR, 6 * DPR] : []);
    cx.beginPath(); cx.arc(0, 0, rr, 0, Math.PI * 2); cx.stroke();
    if (k === 1) { cx.setLineDash([]); cx.fillStyle = hexA("#f3c35a", ringA * 1.3); cx.font = `${12 * DPR}px "JetBrains Mono", monospace`; cx.textAlign = "center";
      for (let i = 0; i < RUNAS.length; i++) { cx.save(); cx.rotate(i / RUNAS.length * Math.PI * 2); cx.fillText(RUNAS[i], 0, -rr - 8 * DPR); cx.restore(); } }
    if (k === 0) { cx.setLineDash([]); cx.fillStyle = hexA(tint, ringA * 1.1); cx.font = `${11 * DPR}px "JetBrains Mono", monospace`; cx.textAlign = "center";
      for (let i = 0; i < FORMULAS.length; i++) { cx.save(); cx.rotate(i / FORMULAS.length * Math.PI * 2 + .3); cx.fillText(FORMULAS[i], 0, -rr - 14 * DPR); cx.restore(); } }
    if (k === 2) { // sigilo geométrico: dois quadrados e um triângulo inscritos
      cx.setLineDash([]); cx.strokeStyle = hexA("#f3c35a", ringA * .8); cx.lineWidth = DPR;
      for (let q = 0; q < 2; q++) { cx.save(); cx.rotate(q * Math.PI / 4); const s = rr / Math.SQRT2; cx.strokeRect(-s, -s, s * 2, s * 2); cx.restore(); }
      cx.strokeStyle = hexA(tint, ringA * .9); cx.beginPath();
      for (let v = 0; v < 4; v++) { const a = v * 2 * Math.PI / 3 - Math.PI / 2; const x = Math.cos(a) * rr * .7, y = Math.sin(a) * rr * .7; v ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.stroke(); cx.beginPath(); cx.arc(0, 0, rr * .35, 0, Math.PI * 2); cx.stroke(); }

  cx.restore(); cx.setLineDash([]); cx.textAlign = "start";

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- Utilidades ---------- */
function render(html) { stage.innerHTML = html; }
function setTint(c) { tint = c; document.documentElement.style.setProperty("--pc", c); }
function flash() { if (reduce) return; flashEl.classList.remove("go"); void flashEl.offsetWidth; flashEl.classList.add("go"); }
function atravessar() { whoosh(); warp = 1; flash(); }
function marcar(sel) { stage.querySelectorAll(sel).forEach((b, i) => b.classList.toggle("sel", i === st.sel)); }
function seal(svg) { return `<span class="seal"><svg viewBox="0 0 64 64" aria-hidden="true">${svg}</svg></span>`; }
function P() { return PORTAIS.find(p => p.id === st.portal); }
function hud() {
  return `<div class="hud"><span>Portais explorados ${st.feitos.length} de ${PORTAIS.length}</span>
          <span class="energy">Energia do Multiverso <b id="en">${st.energia}</b></span></div>`;
}

/* ---------- 1. Abertura ---------- */
function telaIntro() {
  clearLater(); calar();
  st = novoEstado(); cena = null; setTint("#3ef2e0"); acorde(HUB_ACORDE);
  render(`<section class="screen">
      ${mentor(MESTRE.intro, true)}
      <h1>Você está preparado para entrar no <em>Multiverso da Tecnologia</em>?</h1>
      <p class="lead">Coloque o fone. Quatro portais, quatro mundos, quatro artefatos.</p>
      <div class="row"><button class="btn" id="go" type="button">Entrar no Multiverso <kbd>Enter</kbd></button></div>
    </section>`);
  document.getElementById("go").onclick = () => { startDrone(); atravessar(); later(telaHub, 350); };
  st.introFalou = false;
}

/* ---------- 2. Hub com os quatro portais ---------- */
function telaHub() {
  clearLater();
  st.tela = "hub"; st.portal = null; cena = null; setTint("#3ef2e0"); acorde(HUB_ACORDE);
  const livres = PORTAIS.map((p, i) => i).filter(i => !st.feitos.includes(PORTAIS[i].id));
  st.sel = livres[0] ?? 0;
  const primeiro = st.feitos.length === 0;
  render(`<section class="screen">
      ${hud()}
      ${mentor(primeiro ? MESTRE.hub1 : MESTRE.hubN(PORTAIS.length - st.feitos.length))}
      <div class="portals" role="list">
        ${PORTAIS.map((p, i) => { const done = st.feitos.includes(p.id); return `
          <button class="portal ${done ? "done" : ""} ${i === st.sel ? "sel" : ""}" style="--c:${p.cor}" data-i="${i}" type="button" role="listitem" ${done ? 'aria-disabled="true"' : ""}>
            <span class="ring"><svg class="glyph" viewBox="0 0 64 64" aria-hidden="true">${p.glyph}</svg></span>
            <span class="name">${p.nome}</span>
            <span class="key">${done ? "✓ Explorado" : "Tecla " + (i + 1)}</span>
          </button>`; }).join("")}
      </div>
      ${grimorio()}
    </section>`);
  stage.querySelectorAll(".portal").forEach(b => {
    const i = +b.dataset.i;
    b.onclick = () => telaConjurar(i);
    b.onmouseenter = () => { if (!st.feitos.includes(PORTAIS[i].id)) { st.sel = i; marcar(".portal"); } };
  });
  fala(primeiro ? MESTRE.hub1 + " Agro, Saúde, Empreendedorismo ou Tecnologia." : MESTRE.hubN(PORTAIS.length - st.feitos.length));
}
function grimorio() {
  return `<div class="grimorio"><span class="glabel">Grimório</span>${PORTAIS.map(p => {
    const a = st.artefatos.find(x => x.portal === p.id);
    return `<span class="slot ${a ? "got" : ""}" style="--c:${p.cor}"><svg viewBox="0 0 64 64" aria-hidden="true">${p.glyph}</svg>${a ? a.nome : "???"}</span>`;
  }).join("")}</div>`;
}

/* ---------- Conjuração: o visitante desenha um círculo para abrir o portal ---------- */
let spell = null;
function telaConjurar(i) {
  const p = PORTAIS[i]; if (!p || st.feitos.includes(p.id)) return;
  clearLater();
  st.tela = "conjurar"; st.alvo = i; setTint(p.cor); tick();
  render(`<section class="screen">
      ${mentor(MESTRE.conjurar(p.artigo + " " + p.nome))}
      <div class="spell" id="spell"><canvas id="spell-cv"></canvas><div class="spell-hint" id="spell-hint">Desenhe um círculo aqui</div></div>
      <div class="spell-msg" id="spell-msg"></div>
      <div class="row"><button class="btn ghost" id="auto" type="button">Conjurar automaticamente <kbd>Enter</kbd></button></div>
    </section>`);
  fala(MESTRE.conjurar(p.artigo + " " + p.nome));
  const box = document.getElementById("spell"), c = document.getElementById("spell-cv"), g = c.getContext("2d");
  const r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = r.width * dpr; c.height = r.height * dpr;
  spell = { pts: [], sparks: [], drawing: false, done: false, t0: performance.now(), c, g, dpr, cor: p.cor };
  const pos = e => { const b = c.getBoundingClientRect(); return { x: (e.clientX - b.left) * dpr, y: (e.clientY - b.top) * dpr }; };
  box.onpointerdown = e => { if (spell.done) return; box.setPointerCapture?.(e.pointerId); spell.drawing = true; spell.pts = [pos(e)]; document.getElementById("spell-hint").hidden = true; document.getElementById("spell-msg").textContent = ""; };
  box.onpointermove = e => { if (!spell.drawing) return; const q = pos(e); spell.pts.push(q); addSparks(q, 2); if (spell.pts.length % 6 === 0) chime([600 + spell.pts.length * 4], .02); };
  box.onpointerup = box.onpointercancel = () => { if (!spell.drawing) return; spell.drawing = false; avaliarCirculo(); };
  document.getElementById("auto").onclick = autoConjurar;
  requestAnimationFrame(spellLoop);
}
function addSparks(q, n) {
  for (let k = 0; k < n; k++) spell.sparks.push({ x: q.x, y: q.y, vx: (Math.random() - .5) * 3 * spell.dpr, vy: (Math.random() - .5) * 3 * spell.dpr, life: 1 });
}
function spellLoop(t) {
  if (!spell || st.tela !== "conjurar") return;
  const { c, g, dpr, cor } = spell, W2 = c.width, H2 = c.height, R2 = W2 * .38;
  g.clearRect(0, 0, W2, H2);
  // guia: círculo tracejado com runas girando
  g.save(); g.translate(W2 / 2, H2 / 2); g.rotate((t - spell.t0) * .0003);
  g.strokeStyle = hexA(cor, spell.done ? .9 : .28); g.lineWidth = 1.5 * dpr; g.setLineDash([4 * dpr, 10 * dpr]);
  g.beginPath(); g.arc(0, 0, R2, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  g.fillStyle = hexA("#f3c35a", .45); g.font = `${11 * dpr}px "JetBrains Mono", monospace`; g.textAlign = "center";
  for (let i = 0; i < 12; i++) { g.save(); g.rotate(i / 12 * Math.PI * 2); g.fillText(RUNAS[i * 2], 0, -R2 - 10 * dpr); g.restore(); }
  g.restore();
  // traço mágico
  if (spell.pts.length > 1) {
    g.save(); g.lineCap = "round"; g.lineJoin = "round"; g.shadowColor = cor; g.shadowBlur = 18 * dpr;
    g.strokeStyle = cor; g.lineWidth = 5 * dpr; g.beginPath(); spell.pts.forEach((q, k) => k ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y)); g.stroke();
    g.shadowBlur = 0; g.strokeStyle = "#fff"; g.lineWidth = 1.6 * dpr; g.stroke(); g.restore();
  }
  // faíscas
  spell.sparks = spell.sparks.filter(s => (s.life -= .025) > 0);
  for (const s of spell.sparks) { s.x += s.vx; s.y += s.vy; g.fillStyle = hexA(Math.random() < .5 ? cor : "#f3c35a", s.life); g.fillRect(s.x, s.y, 2.2 * dpr, 2.2 * dpr); }
  requestAnimationFrame(spellLoop);
}
function avaliarCirculo() {
  const P = spell.pts; const msg = document.getElementById("spell-msg");
  if (P.length < 12) { msg.textContent = "Desenhe um círculo completo, sem soltar."; return; }
  const cx0 = P.reduce((s, q) => s + q.x, 0) / P.length, cy0 = P.reduce((s, q) => s + q.y, 0) / P.length;
  const raio = P.reduce((s, q) => s + Math.hypot(q.x - cx0, q.y - cy0), 0) / P.length;
  let giro = 0;
  for (let k = 1; k < P.length; k++) {
    let d = Math.atan2(P[k].y - cy0, P[k].x - cx0) - Math.atan2(P[k - 1].y - cy0, P[k - 1].x - cx0);
    if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; giro += d;
  }
  if (Math.abs(giro) >= 5.2 && raio > spell.c.width * .12) return portalAberto();
  msg.textContent = Math.abs(giro) >= 3 ? "Quase! Feche o círculo." : "O portal não respondeu. Tente um círculo maior.";
  chime([330], .05); spell.pts = [];
}
function autoConjurar() {
  if (!spell || spell.done) return;
  document.getElementById("spell-hint").hidden = true;
  const W2 = spell.c.width, R2 = W2 * .38, t0 = performance.now(), dur = 900; spell.pts = [];
  (function passo(t) {
    if (!spell || st.tela !== "conjurar") return;
    const f = Math.min(1, (t - t0) / dur), a = -Math.PI / 2 + f * Math.PI * 2;
    const q = { x: W2 / 2 + Math.cos(a) * R2, y: W2 / 2 + Math.sin(a) * R2 }; spell.pts.push(q); addSparks(q, 3);
    if (f < 1) requestAnimationFrame(passo); else portalAberto();
  })(t0);
}
function portalAberto() {
  if (spell.done) return; spell.done = true;
  const W2 = spell.c.width; for (let k = 0; k < 120; k++) addSparks({ x: W2 / 2 + (Math.random() - .5) * W2 * .7, y: W2 / 2 + (Math.random() - .5) * W2 * .7 }, 1);
  document.getElementById("spell-msg").textContent = "Portal aberto!";
  fanfare(); spinBoost = 1;
  later(() => entrar(st.alvo), 800);
}

/* ---------- 3. Dentro do portal: imersão ---------- */
function entrar(i) {
  const p = PORTAIS[i]; if (!p || st.feitos.includes(p.id)) return;
  clearLater();
  st.portal = p.id; st.tela = "imersao";
  setTint(p.cor); cena = p.cena; acorde(p.acorde); atravessar();
  render(`<section class="screen">
      ${seal(p.glyph)}
      <span class="eyebrow">Portal ${p.nome}</span>
      <h2>Você entrou no universo ${p.artigo} <span class="pcol">${p.nome}</span></h2>
      <p class="story">${p.hoje}</p>
      <div class="row"><button class="btn" id="go" type="button">Aceitar a missão <kbd>Enter</kbd></button></div>
    </section>`);
  document.getElementById("go").onclick = telaMissao;
  fala(`Você entrou no universo ${p.artigo} ${p.nome}. ${p.hoje}`);
}

function telaMissao() {
  clearLater();
  const p = P(); st.tela = "missao"; st.sel = 0; tick();
  render(`<section class="screen">
      ${hud()}
      <span class="eyebrow">Missão · ${p.nome}</span>
      <h2>${p.missao}</h2>
      <div class="choices">
        ${p.opcoes.map((o, k) => `
          <button class="choice ${k === 0 ? "sel" : ""}" data-k="${k}" type="button">
            <span class="k">${LETRAS[k]}</span>
            <span class="t">${o.t}</span>
            <span class="d">${o.d}</span>
          </button>`).join("")}
      </div>
    </section>`);
  stage.querySelectorAll(".choice").forEach(b => {
    b.onclick = () => escolher(+b.dataset.k);
    b.onmouseenter = () => { st.sel = +b.dataset.k; marcar(".choice"); };
  });
  fala(p.missao);
}

function escolher(k) {
  if (st.tela !== "missao") return;
  const p = P(), o = p.opcoes[k];
  st.tela = "revelacao";
  st.escolhas.push(o.p); st.feitos.push(p.id); st.artefatos.push({ nome: o.artefato, portal: p.id });
  const ganho = 180 + Math.round(Math.random() * 12) * 5; // pontuação só para diversão
  st.energia += ganho;
  chime();
  const ultimo = st.feitos.length === PORTAIS.length;
  render(`<section class="screen">
      <span class="eyebrow">Artefato conquistado</span>
      <div class="relic">${seal(p.glyph)}<div><div class="rname">${o.artefato}</div><div class="rtech">Tecnologia ativada: ${o.t}</div></div></div>
      <div class="reveal">
        <p><span class="tag">A inteligência por trás</span><span class="ia">${o.ia}</span></p>
        <p><span class="tag">O futuro que você criou</span>${o.futuro}</p>
      </div>
      <div class="gain">+${ganho} de Energia do Multiverso</div>
      <div class="row"><button class="btn" id="go" type="button">${ultimo ? "Ver meu resultado" : "Voltar ao Multiverso"} <kbd>Enter</kbd></button></div>
    </section>`);
  document.getElementById("go").onclick = () => { atravessar(); ultimo ? telaAnalise() : telaHub(); };
  fala(`Você conquistou ${o.artefato}. A inteligência por trás: ${o.ia}. ${o.futuro}`);
}

/* ---------- 4. Análise ---------- */
function calcularPerfil() {
  const c = { A: 0, E: 0, G: 0, I: 0 };
  st.escolhas.forEach(p => c[p]++);
  const max = Math.max(...Object.values(c));
  const top = Object.keys(c).filter(k => c[k] === max);
  return top.length === 1 ? top[0] : "I"; // empate = perfil que combina tudo = Inovador
}
function telaAnalise() {
  clearLater();
  st.tela = "analise"; cena = null; setTint("#3ef2e0"); acorde(HUB_ACORDE); spinBoost = 1;
  const linhas = ["Unindo os quatro artefatos…", "Agro, Saúde, Empreendedorismo e Tecnologia…", "Todos usam a mesma força…", "Título revelado."];
  render(`<section class="screen">
      ${mentor(MESTRE.analise)}
      <h2>Analisando sua jornada pelo Multiverso…</h2>
      ${grimorio()}
      <div class="links">${PORTAIS.map(p => `<span style="color:${p.cor}">${p.nome}</span>`).join("")}</div>
      <div class="meter"><i id="bar"></i></div>
      <div class="scan" id="scan">${linhas[0]}</div>
    </section>`);
  fala(MESTRE.analise);
  const bar = document.getElementById("bar"), scan = document.getElementById("scan"), total = 4000;
  bar.style.transition = `width ${total}ms cubic-bezier(.4,.1,.3,1)`;
  later(() => bar.style.width = "100%", 50);
  linhas.forEach((l, k) => later(() => { scan.textContent = l; tick(); }, k * (total / linhas.length)));
  later(telaPerfil, total + 300);
}

/* ---------- 5. Perfil ---------- */
function telaPerfil() {
  clearLater();
  const key = calcularPerfil(), Pf = PERFIS[key];
  st.tela = "perfil"; st.perfil = key;
  setTint(Pf.cor); atravessar(); fanfare();
  const nivel = Math.min(99, 80 + Math.round((st.energia - 720) / 12));
  render(`<section class="screen">
      <div class="card">
        ${seal(Pf.glyph)}
        <div>
          <div class="kicker">Título conquistado · ${TITULO}</div>
          <div class="pname">${Pf.nome}</div>
          <p class="lema">${Pf.lema}</p>
          <p class="desc">${Pf.desc}</p>
          <div class="poder"><span>Meu poder</span> ${Pf.poder.charAt(0).toUpperCase() + Pf.poder.slice(1)}</div>
        </div>
        <div class="foot">
          <span>Energia do Multiverso: <b>${st.energia} pontos</b></span>
          <span>Nível tecnológico: <b>${nivel}%</b></span>
          <span>Grimório: <b>${st.artefatos.length} artefatos</b></span>
          <span>Unimar Aberta</span>
        </div>
      </div>
      <p class="lead" style="font-size:clamp(13px,1.4vw,16px)">Tire uma foto do seu resultado e compartilhe.</p>
      <div class="row"><button class="btn" id="go" type="button">Continuar <kbd>Enter</kbd></button></div>
    </section>`);
  document.getElementById("go").onclick = telaFinal;
  fala(`Eu declaro: você é ${TITULO}, ${Pf.nome}. ${Pf.lema} Seu poder no Multiverso: ${Pf.poder}`);
}

/* ---------- 6. Fechamento: o curso de IA ---------- */
function telaFinal() {
  clearLater();
  const Pf = PERFIS[st.perfil];
  st.tela = "final"; chime([523.3, 784, 1046.5]);
  render(`<section class="screen tight">
      ${mentor(MESTRE.final)}
      <h2 class="h2s">O que o Agro, a Saúde, o Empreendedorismo e a Tecnologia têm em comum?</h2>
      <div class="ia-word">${CURSO_FOCO}</div>
      <div class="course-main">
        <small>Curso de ${CURSO_FOCO} · Unimar</small>
        <b>Quem cria o futuro é quem cria a tecnologia.</b>
        <p>Em todos os portais que você atravessou havia alguém por trás da inteligência. No curso de ${CURSO_FOCO} da Unimar, como <strong>${Pf.nome}</strong>, você vai ${Pf.naIA}.</p>
      </div>
      <div class="others">Também na Unimar: ${OUTROS_CURSOS.map(c => `<b>${c}</b>`).join(" · ")}</div>
      <div class="row">
        <button class="btn" id="go" type="button">Descobrir mais <kbd>Enter</kbd></button>
        <button class="btn ghost" id="fim" type="button">Nova jornada</button>
      </div>
    </section>`);
  document.getElementById("go").onclick = telaMais;
  document.getElementById("fim").onclick = telaIntro;
  fala(`${MESTRE.final} O que o agro, a saúde, o empreendedorismo e a tecnologia têm em comum? ${CURSO_FOCO}. Quem cria o futuro é quem cria a tecnologia. Venha fazer ${CURSO_FOCO} na Unimar.`);
}

function telaMais() {
  clearLater();
  st.tela = "mais";
  render(`<section class="screen">
      <span class="eyebrow">Descobrir mais</span>
      <h2>Entre no mundo de quem <em>cria o futuro</em></h2>
      <div class="more">
        <div class="qr" id="qr" aria-label="QR Code para a página do curso"></div>
        <div>
          <p>Aponte a câmera do celular para o QR Code e conheça o curso de <strong>${CURSO_FOCO}</strong> da Unimar.</p>
          <p style="color:var(--muted)">Ou converse com nossos alunos aqui no estande.</p>
          <div class="url">${LINK_CURSO}</div>
        </div>
      </div>
      <div class="row"><button class="btn" id="go" type="button">Nova jornada <kbd>Enter</kbd></button></div>
    </section>`);
  try { const q = qrcode(0, "M"); q.addData(LINK_CURSO); q.make(); document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); }
  catch (e) { document.getElementById("qr").hidden = true; }
  document.getElementById("go").onclick = telaIntro;
  fala(`Aponte a câmera do celular para o QR Code e conheça o curso de ${CURSO_FOCO} da Unimar.`);
}

/* ---------- Teclado ---------- */
addEventListener("keydown", e => {
  resetIdle();
  if (e.key === "Escape") { telaIntro(); return; }
  const n = parseInt(e.key, 10);
  if (st.tela === "hub") {
    const livres = PORTAIS.map((p, i) => i).filter(i => !st.feitos.includes(PORTAIS[i].id));
    if (n >= 1 && n <= PORTAIS.length) return telaConjurar(n - 1);
    const pos = livres.indexOf(st.sel);
    if (["ArrowRight", "ArrowDown"].includes(e.key)) { st.sel = livres[(pos + 1) % livres.length]; marcar(".portal"); tick(); }
    if (["ArrowLeft", "ArrowUp"].includes(e.key)) { st.sel = livres[(pos - 1 + livres.length) % livres.length]; marcar(".portal"); tick(); }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); telaConjurar(st.sel); }
    return;
  }
  if (st.tela === "conjurar") { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); autoConjurar(); } return; }
  if (st.tela === "missao") {
    const L = LETRAS.indexOf(e.key.toUpperCase()); const k = L >= 0 ? L : n - 1;
    if (k >= 0 && k < 3) return escolher(k);
    if (["ArrowRight", "ArrowDown"].includes(e.key)) { st.sel = (st.sel + 1) % 3; marcar(".choice"); tick(); }
    if (["ArrowLeft", "ArrowUp"].includes(e.key)) { st.sel = (st.sel + 2) % 3; marcar(".choice"); tick(); }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); escolher(st.sel); }
    return;
  }
  if (e.key === "Enter" || e.key === " ") {
    const b = document.getElementById("go");
    if (b && document.activeElement !== b) { e.preventDefault(); b.click(); }
  }
});

/* ---------- Volta ao início sozinho ---------- */
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (st.tela !== "intro" && st.tela !== "analise") telaIntro(); }, IDLE_MS); }
["pointerdown", "pointermove"].forEach(ev => addEventListener(ev, resetIdle, { passive: true }));

/* ---------- Barra de controle ---------- */
const btSom = document.getElementById("bt-som"), btVoz = document.getElementById("bt-voz");
btSom.onclick = () => { somOn = !somOn; btSom.setAttribute("aria-pressed", somOn); btSom.textContent = somOn ? "Som ligado" : "Som desligado"; setDrone(somOn); };
btVoz.onclick = () => { vozOn = !vozOn; btVoz.setAttribute("aria-pressed", vozOn); btVoz.textContent = vozOn ? "Narração ligada" : "Narração desligada"; if (!vozOn) calar(); };
document.getElementById("bt-tela").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
document.getElementById("bt-reset").onclick = telaIntro;

telaIntro();
</script>
